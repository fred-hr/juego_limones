<!DOCTYPE html>
<html>

<head>
  <title>Juego Atrapar Limones</title>

  <link rel="stylesheet" href="limones.css">

  <script src="utils.js"></script>
</head>


<body onload="iniciar()">

  <div class="contenedor">

    <div class="encabezado">

      <img src="logo.png" class="logoKrakeDev"/>

      <p class="modoArcade">★ ARCADE MODE ★</p>

      <h1>🍋 ATRAPAR LIMONES 🍋</h1>

      <p class="frase">
        Si del cielo te caen limones... ¡ATRÁPALOS!
      </p>

      <h2 class="autor">
        Autor: Freddy Campuzano
      </h2>

    </div>


    <div class="zonaJuego">

      <canvas
        id="areaJuego"
        width="600"
        height="400">
      </canvas>

    </div>


    <div class="panel">

      <div class="marcador">
        <span class="icono">🏆</span>
        <span>PUNTAJE</span>
        <span id="txtPuntaje" class="numero">0</span>
      </div>

      <div class="marcador">
        <span class="icono">❤️</span>
        <span>VIDAS</span>
        <span id="txtVidas" class="numero">3</span>
      </div>

    </div>


    <p class="tituloControles">
      CONTROLES
    </p>


    <div class="botones">

      <button
        class="boton movimiento"
        onclick="moverIzquierda()">
        ◀ IZQUIERDA
      </button>

      <button
        class="boton movimiento"
        onclick="moverDerecha()">
        DERECHA ▶
      </button>

      <button
        class="boton pausa"
        onclick="pausarJuego()">
        ⏸ PAUSA
      </button>

      <button
        class="boton play"
        onclick="continuarJuego()">
        ▶ PLAY
      </button>

      <button
        class="boton reiniciar"
        onclick="reiniciar()">
        ↻ REINICIAR
      </button>

      <button
        class="boton borrar"
        onclick="desaparecerpersonaje()">
        👻 BORRAR PERSONAJE
      </button>

    </div>
    <div class="volverMenu">
      <a href="https://menu-u7oc.vercel.app/" class="botonMenu">
          ← VOLVER AL MENÚ
      </a>
    </div>


    <div class="ayuda">

      <span>◀ ▶ Mover</span>

      <span>⏸ Pausar</span>

      <span>▶ Continuar</span>

    </div>


    <div id="mensajeGanador" style="display:none;">

      <div class="trofeo">
        🏆
      </div>

      <h2>
        ¡GANASTE!
      </h2>

      <p>
        ¡Atrapaste los limones... ahora prepara limonada
        y presume tus reflejos campeones! 🍋🏆
      </p>

      <img
        src="ganador.png"
        width="300">

    </div>

  </div>


  <script src="limones.js"></script>

</body>

</html>
